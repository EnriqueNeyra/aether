name: Deploy Pages

on:
  workflow_run:
    workflows: ["Release Firmware"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Pages artifact
        run: |
          mkdir -p site
          cp -r www/* site/
          cp manifests/manifest.json site/manifest.json
          cp manifests/ota-manifest.json site/ota-manifest.json
          
          echo "Downloading latest OTA binary to bypass GitHub Releases redirect..."
          curl -sL "https://github.com/enriqueneyra/aether/releases/latest/download/aether-ota.bin" -o site/aether-ota.bin
          
          echo "Downloading latest factory binary for WebUSB flasher..."
          curl -sL "https://github.com/enriqueneyra/aether/releases/latest/download/aether-factory.bin" -o site/aether-factory.bin

          echo "aether.syntropylabs.io" > site/CNAME
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
