name: Deploy Pages

on:
  workflow_run:
    workflows: ["Release Firmware"]
    types:
      - completed
  # Site and manifest edits don't cut a firmware release, so deploy them here.
  push:
    branches:
      - main
    paths:
      - "www/**"
      - "manifests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build Pages artifact
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r www/* site/
          cp manifests/manifest.json site/manifest.json
          cp manifests/ota-manifest.json site/ota-manifest.json

          # Serve the binaries for the exact version the manifests describe,
          # not "latest", so a release landing mid-deploy can't mismatch them.
          VERSION="$(python3 -c 'import json; print(json.load(open("manifests/manifest.json"))["version"])')"
          OTA_VERSION="$(python3 -c 'import json; print(json.load(open("manifests/ota-manifest.json"))["version"])')"
          test "${VERSION}" = "${OTA_VERSION}"
          BASE="https://github.com/EnriqueNeyra/aether/releases/download/v${VERSION}"

          echo "Downloading v${VERSION} binaries to bypass the GitHub Releases redirect..."
          curl -fsSL "${BASE}/aether-ota.bin" -o site/aether-ota.bin
          curl -fsSL "${BASE}/aether-factory.bin" -o site/aether-factory.bin

          # Devices reject an OTA image whose MD5 differs from the manifest, so
          # never publish a pair that disagrees.
          EXPECTED_MD5="$(python3 -c 'import json; print(json.load(open("manifests/ota-manifest.json"))["builds"][0]["ota"]["md5"])')"
          ACTUAL_MD5="$(md5sum site/aether-ota.bin | cut -d' ' -f1)"
          if [ "${EXPECTED_MD5}" != "${ACTUAL_MD5}" ]; then
            echo "::error::aether-ota.bin MD5 ${ACTUAL_MD5} does not match ota-manifest.json ${EXPECTED_MD5}"
            exit 1
          fi

          echo "aether.syntropylabs.io" > site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v5
